# 기본 브랜치(main)에 푸시하면 테스트 → 빌드 → GitHub Pages 배포.
# 테스트나 빌드가 실패하면 배포하지 않는다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 배포는 끝까지 두고 대기 중인 것만 최신으로 바꾼다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages 주소(https://<계정>.github.io/<저장소>)와 경로(/<저장소>)를 받아 빌드에 넘긴다
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
