<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가게 이익 노트 (베타)</title>
    <meta name="description" content="홀·배달·포장 매출과 비용을 한눈에. 비용을 반영한 가게 전체 영업이익으로 얼마나 남았는지 확인하세요." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 홈 화면 설치: 매니페스트는 빌드 때 자동으로 연결된다(vite-plugin-pwa). 아래는 아이폰 Safari용 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="가게 이익 노트" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f6f6f4" />
    <!-- 링크 공유 미리보기 (카카오톡·페이스북·X 등). 주소 앞부분은 빌드 때 SITE_URL 값으로 채워진다 (vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="가게 이익 노트" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="가게 이익 노트 — 얼마나 남았을까?" />
    <meta property="og:description" content="홀·배달·포장 매출과 비용을 한눈에. 비용을 반영한 가게 전체 영업이익으로 확인하세요." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="가게 이익 노트 로고와 ‘얼마나 남았을까? 홀·배달·포장 매출과 비용을 한눈에’ 문구, 영수증 그림" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="가게 이익 노트 — 얼마나 남았을까?" />
    <meta name="twitter:description" content="홀·배달·포장 매출과 비용을 한눈에. 비용을 반영한 가게 전체 영업이익으로 확인하세요." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
